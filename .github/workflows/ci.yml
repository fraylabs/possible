name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "registry/entries/**"
      - "registry/snapshots/**"
      - "packages/packs/src/federated-catalog.json"
      - "skills/possible/references/packs.md"
      - "apps/cli/assets/possible/references/packs.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
