name: Outcome Pack proposal
description: Propose a reusable, verifiable outcome contract.
title: "[Pack]: "
labels: [outcome-pack]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should a user be able to rely on when this pack completes?
    validations:
      required: true
  - type: textarea
    id: workstreams
    attributes:
      label: Structured Prompt
      description: What workstreams, owned outputs, guardrails and verification should the Run Prompt coordinate?
    validations:
      required: true
  - type: textarea
    id: skills
    attributes:
      label: Skills
      description: Which reviewed capabilities and exact source revisions does the outcome require?
    validations:
      required: true
  - type: textarea
    id: expectations
    attributes:
      label: Expectations
      description: What observable checklist, failure modes and fresh evidence determine completion?
    validations:
      required: true
