<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #151411;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-question"
        class="scene"
        data-composition-id="01-question"
        data-composition-src="compositions/frames/01-question.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-artifact-not-proof"
        class="scene"
        data-composition-id="02-artifact-not-proof"
        data-composition-src="compositions/frames/02-artifact-not-proof.html"
        data-start="4"
        data-duration="5.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-meet-possible"
        class="scene"
        data-composition-id="03-meet-possible"
        data-composition-src="compositions/frames/03-meet-possible.html"
        data-start="9"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-three-primitives"
        class="scene"
        data-composition-id="04-three-primitives"
        data-composition-src="compositions/frames/04-three-primitives.html"
        data-start="15"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-evidence-chain"
        class="scene"
        data-composition-id="05-evidence-chain"
        data-composition-src="compositions/frames/05-evidence-chain.html"
        data-start="22"
        data-duration="8.4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="30"
        data-duration="5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-question", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-artifact-not-proof", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-artifact-not-proof", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 9);
        tl.fromTo("#el-03-meet-possible", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 9);
        tl.to("#el-03-meet-possible", { x: 1920, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.fromTo("#el-04-three-primitives", { x: -1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.to("#el-04-three-primitives", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.fromTo("#el-05-evidence-chain", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.to("#el-05-evidence-chain", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 30);
        tl.fromTo("#el-06-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 30);
        tl.to({}, { duration: 35 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
